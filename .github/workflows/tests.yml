name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    name: Python 3.12 / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-dependency-glob: |
            requirements-dev.lock
            pyproject.toml
      - run: uv venv --python 3.12
      - name: Install pinned development and figures dependencies
        run: uv pip install --require-hashes -r requirements-dev.lock
      - name: Install project without changing locked dependencies
        run: uv pip install --no-build-isolation --no-deps -e .
      - name: Ruff
        run: uv run --no-sync ruff check .
      - name: Check documentation links, project index and orphaned files
        run: uv run --no-sync python scripts/check_repository.py
      - name: Smoke-test isolated wheel imports and dataset-free demo
        run: uv run --no-sync python scripts/smoke_wheel.py
      - run: uv run --no-sync pytest -q
