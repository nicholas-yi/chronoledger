[project]
name = "asof"
version = "0.1.0"
description = "Point-in-time, provenance-reconciled research engine for US equities built from SEC filings."
readme = "README.md"
authors = [
    { name = "Nicholas Yi", email = "nicholasyiofficial@gmail.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "pytz>=2024.1",
]

[project.optional-dependencies]
embed = [
    "torch>=2.4",
    "transformers>=4.48",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
]
figures = [
    "matplotlib>=3.8",
]

[project.scripts]
asof = "asof.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that call live SEC or market-data endpoints"]
addopts = "-m 'not network'"
filterwarnings = ["ignore:The inplace keyword in DataFrame.drop is deprecated"]

[tool.ruff]
line-length = 100
