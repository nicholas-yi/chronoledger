[project]
name = "asof"
version = "0.1.0"
description = "Point-in-time, provenance-reconciled research engine for US equities built from SEC filings."
readme = "README.md"
authors = [
    { name = "Nicholas Yi", email = "nicholasyiofficial@gmail.com" }
]
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "httpx>=0.27",
    "numpy>=1.26",
    "scipy>=1.13",
    "statsmodels>=0.14",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "pydantic>=2.7",
    "pytz>=2024.1",
]

[project.optional-dependencies]
embed = [
    "torch>=2.4",
    "transformers>=4.48",
]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
]
figures = [
    "matplotlib>=3.8",
]
verifier = [
    "torch==2.9.1",
    "transformers==4.57.6",
    "sentencepiece==0.2.1",
    "safetensors==0.7.0",
]
benchmarks = [
    "tqdm==4.70.1",
    "sympy==1.14.0",
    "mpmath==1.3.0",
]
sentiment = [
    "vaderSentiment==3.3.2",
]

[project.scripts]
asof = "asof.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: tests that call live SEC or market-data endpoints"]
addopts = "-m 'not network'"
filterwarnings = ["ignore:The inplace keyword in DataFrame.drop is deprecated"]

[tool.ruff]
line-length = 100

# TODO(CL-HARDEN-1): retire these code-specific legacy findings incrementally.
# Baseline recorded before hardening; no blanket ignores or mass reformat.
[tool.ruff.lint.per-file-ignores]
"scripts/calibrate_tfidf.py" = ["UP017"]
"scripts/event_diagnostics.py" = ["RUF046"]
"scripts/h0_data.py" = ["BLE001", "UP017"]
"scripts/leakprobe.py" = ["RUF010"]
"src/asof/backtest.py" = ["SIM114"]
"src/asof/changes.py" = ["UP035", "UP037"]
"src/asof/invariance.py" = ["UP035"]
"src/asof/prices.py" = ["UP017"]
"src/asof/referee.py" = ["BLE001", "PLW1510", "RUF100", "UP017", "UP035"]
"src/asof/sections.py" = ["BLE001"]
"src/asof/store.py" = ["UP017", "UP035"]
"src/asof/timeutil.py" = ["FURB162", "UP017"]
"tests/test_backtest.py" = ["UP017"]
"tests/test_changes.py" = ["RUF100", "UP017"]
"tests/test_chrono.py" = ["UP017"]
"tests/test_invariance.py" = ["UP017"]
"tests/test_quiet.py" = ["UP017"]
"tests/test_reconcile.py" = ["UP017"]
"tests/test_referee.py" = ["RUF100"]
"tests/test_timeutil.py" = ["UP017"]
